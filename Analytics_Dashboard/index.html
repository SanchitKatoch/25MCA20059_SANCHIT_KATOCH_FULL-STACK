<!DOCTYPE html>
<html lang="en">
<head>
<title>Analytics Dashboard</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="topbar">
        <h1>Analytics Dashboard</h1>
        <p>Real-time business insights</p>
    </header>

    <!-- KPI Cards -->
    <section class="kpi-grid">

        <article class="kpi-card">
            <h3>Revenue</h3>
            <p>₹1,25,000</p>
        </article>

        <article class="kpi-card">
            <h3>Users</h3>
            <p>8,420</p>
        </article>

        <article class="kpi-card">
            <h3>Orders</h3>
            <p>1,240</p>
        </article>

        <article class="kpi-card">
            <h3>Conversion</h3>
            <p>4.8%</p>
        </article>

    </section>

    <!-- Charts Section -->
    <section class="charts">

        <article class="chart-box">
            <h3>Sales Overview</h3>
            <div class="chart-placeholder"></div>
        </article>

        <article class="chart-box">
            <h3>Traffic Sources</h3>
            <div class="chart-placeholder circle"></div>
        </article>

    </section>

    <!-- Table -->
    <section class="table-section">
        <h2>Recent Orders</h2>

        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>Order ID</th>
                        <th>Customer</th>
                        <th>Status</th>
                        <th>Amount</th>
                    </tr>
                </thead>

                <tbody>
                    <tr>
                        <td>#101</td>
                        <td>Aman</td>
                        <td>Delivered</td>
                        <td>₹2,500</td>
                    </tr>

                    <tr>
                        <td>#102</td>
                        <td>Riya</td>
                        <td>Pending</td>
                        <td>₹1,200</td>
                    </tr>

                    <tr>
                        <td>#103</td>
                        <td>John</td>
                        <td>Shipped</td>
                        <td>₹3,800</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </section>
</body>
</html>
